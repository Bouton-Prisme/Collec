<!DOCTYPE html>
<html lang="en" class="dark" data-zoom="80">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roulette - BitShop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <style>
    :root { --bg: #0b0c10; }
    html { font-size: 16px; }
    html[data-zoom="90"] { font-size: 14.4px; }
    html[data-zoom="80"] { font-size: 12.8px; }
    html[data-zoom="75"] { font-size: 11.8px; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(140vw 90vh at 50% -10%, rgba(82, 101, 189, 0.14), transparent 70%),
        radial-gradient(110vw 70vh at 80% 10%, rgba(56,189,248,.10), transparent 60%),
        linear-gradient(var(--bg), var(--bg));
      background-repeat: no-repeat;
      background-attachment: fixed, fixed, fixed;
      background-color: var(--bg);
    }
    .coverflow-stage {
      position: relative;
      width: min(100vw, 1120px);
      height: clamp(300px, 42vw, 470px);
      perspective: 1300px;
      perspective-origin: 50% 50%;
      overflow: hidden;
      transform-style: preserve-3d;
      display: grid;
      place-items: center;
    }
    .coverflow-stage::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 52%;
      width: min(56vw, 560px);
      height: min(22vw, 180px);
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse, rgba(103,232,249,.18), transparent 68%);
      filter: blur(10px);
      pointer-events: none;
    }
    .coverflow-stage::after {
      content: "";
      position: absolute;
      inset: auto 6% 22px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent);
      pointer-events: none;
    }
    .coverflow-card {
      position: absolute;
      left: 50%;
      top: 50%;
      width: clamp(170px, 24vw, 320px);
      aspect-ratio: 4 / 4;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 10px;
      overflow: hidden;
      background: rgba(4,8,14,.86);
      box-shadow: 0 24px 70px rgba(0,0,0,.36);
      transform: translate(-50%, -50%);
      transform-style: preserve-3d;
      transition: left .34s cubic-bezier(.2,.8,.2,1), width .34s ease, height .34s ease, transform .34s cubic-bezier(.2,.8,.2,1), opacity .34s ease, filter .34s ease, box-shadow .34s ease, border-color .34s ease, background .34s ease;
      will-change: left, transform, opacity, filter;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 0;
    }
    .coverflow-media {
      width: 100%;
      height: 100%;
      border-radius: 7px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.08), rgba(255,255,255,.025) 58%, rgba(0,0,0,.12));
      display: grid;
      place-items: center;
    }
    .coverflow-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }
    .coverflow-card.is-active {
      border-color: rgba(103,232,249,.62);
      box-shadow: 0 34px 90px rgba(56,189,248,.16), 0 0 0 1px rgba(103,232,249,.26);
    }
    .coverflow-stage.is-revealed .coverflow-card:not(.is-active) {
      opacity: 0 !important;
      pointer-events: none;
    }
    .coverflow-stage.is-revealed {
      height: min(68vh, 620px);
      overflow: visible;
    }
    .coverflow-stage.is-revealed .coverflow-card.is-active {
      width: min(92vw, 900px);
      height: min(68vh, 620px);
      aspect-ratio: auto;
      border-color: transparent;
      background: transparent;
      box-shadow: none;
      overflow: visible;
    }
    .coverflow-stage.is-revealed .coverflow-card.is-active .coverflow-media {
      background: transparent;
      overflow: visible;
    }
    .coverflow-stage.is-revealed .coverflow-card.is-active img {
      object-fit: contain;
    }
    .coverflow-stage.is-revealed .coverflow-marker {
      opacity: 0;
    }
    .coverflow-card.is-winner {
      animation: revealPop .7s cubic-bezier(.18,.9,.24,1.25);
    }
    .coverflow-marker {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 76px;
      height: 3px;
      border-radius: 999px;
      background: rgb(103,232,249);
      box-shadow: 0 0 24px rgba(103,232,249,.55);
      z-index: 2;
    }
    .roulette-result {
      min-height: 1.5rem;
    }
    .roulette-filename {
      margin-top: 12px;
      min-height: 2.2rem;
      max-width: min(90vw, 720px);
      font-size: clamp(1.15rem, 2vw, 1.65rem);
      font-weight: 800;
      line-height: 1.2;
      color: rgba(255,255,255,.96);
      text-wrap: balance;
      overflow-wrap: anywhere;
      text-shadow: 0 0 24px rgba(103,232,249,.18);
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity .25s ease, transform .25s ease;
    }
    .roulette-filename.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
    @keyframes revealPop {
      0% { transform: translate(-50%, -50%) translateZ(220px) rotateY(0deg) scale(.88); }
      45% { transform: translate(-50%, -50%) translateZ(240px) rotateY(0deg) scale(1.04); }
      100% { transform: translate(-50%, -50%) translateZ(220px) rotateY(0deg) scale(1); }
    }
    @media (max-width: 640px) {
      .coverflow-stage { height: 300px; }
      .coverflow-card { width: 190px; }
      .coverflow-stage.is-revealed .coverflow-card.is-active {
        width: min(94vw, 620px);
        height: min(54vh, 420px);
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-white text-black transition-colors dark:bg-black dark:text-white">
  <header>
    <nav class="flex justify-between items-center px-6 py-4 text-sm text-gray-600 dark:text-gray-300">
      <a href="home.html" class="font-bold text-white text-lg mt-1">BitShop</a>
      <div class="flex items-center gap-3">
        <a href="home.html" class="px-4 py-2 text-white border border-white rounded text-sm hover:bg-white hover:text-black inline-block">Home</a>
        <a href="admin.php" class="px-4 py-2 text-white border border-white rounded text-sm hover:bg-white hover:text-black inline-block">Admin</a>
      </div>
    </nav>
  </header>

  <main class="flex-1 text-center pt-16 px-4 pb-16">
    <h1 class="text-3xl font-bold">Roulette</h1>
    <p class="text-gray-600 dark:text-gray-500 text-lg mb-12">Use a token and reveal a random configured image.</p>

    <section class="mx-auto flex max-w-5xl flex-col items-center">
      <div class="coverflow-stage" data-coverflow-stage>
        <div class="coverflow-marker" aria-hidden="true"></div>
      </div>
      <div class="roulette-filename" data-roulette-filename></div>

      <div class="mt-10 flex flex-col items-center gap-4">
        <button type="button"
          class="px-6 py-3 text-white font-bold rounded-lg bg-cyan-950 border border-sky-700 hover:opacity-90 transition disabled:cursor-not-allowed disabled:opacity-50"
          data-spin-button>
          Use token
        </button>
        <p class="roulette-result text-sm text-gray-400" data-roulette-status>Unlimited tokens available.</p>
      </div>
    </section>
  </main>

  <footer class="flex flex-col sm:flex-row justify-between text-xs text-gray-400 dark:text-gray-500 px-6 py-8 border-t border-gray-200 dark:border-gray-700">
    <div>© 2025 BitShop</div>
    <div class="flex gap-6 mt-2 sm:mt-0">
      <a href="support.html">Support</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const fallbackMedia = [
        { src: 'Pack1.png', alt: 'Roulette image' },
        { src: 'Pack2.png', alt: 'Roulette image' },
        { src: 'Pack3.png', alt: 'Roulette image' },
        { src: 'Pack4.png', alt: 'Roulette image' },
        { src: 'Pack5.png', alt: 'Roulette image' },
        { src: 'Pack6.png', alt: 'Roulette image' }
      ];

      const stage = document.querySelector('[data-coverflow-stage]');
      const button = document.querySelector('[data-spin-button]');
      const status = document.querySelector('[data-roulette-status]');
      const filename = document.querySelector('[data-roulette-filename]');
      let media = fallbackMedia;
      let spinning = false;
      let revealed = false;
      let activeIndex = 0;
      let cards = [];

      const validMedia = (items) => Array.isArray(items)
        ? items.filter((item) => item && typeof item.src === 'string' && item.src.trim() !== '')
        : [];

      try {
        const response = await fetch(`products.json?v=${Date.now()}`, { cache: 'no-store' });
        if (response.ok) {
          const config = await response.json();
          const rouletteMedia = validMedia(config.roulette && config.roulette.media);
          if (rouletteMedia.length) {
            media = rouletteMedia;
          }
        }
      } catch (error) {
        console.warn('Could not load roulette media.', error);
      }

      const wrapIndex = (index) => ((index % media.length) + media.length) % media.length;

      const coverflowSlot = (index, center) => {
        const length = media.length;
        let distance = index - center;
        if (distance > length / 2) distance -= length;
        if (distance < -length / 2) distance += length;
        return distance;
      };

      const fileNameFromSrc = (src) => {
        const clean = String(src || '').split('?')[0].split('#')[0];
        return decodeURIComponent(clean.split('/').pop() || clean || 'Selected image');
      };

      const updateFilename = () => {
        if (!filename || !media[activeIndex]) return;
        filename.textContent = fileNameFromSrc(media[activeIndex].src);
      };

      const showFilename = (visible) => {
        if (!filename) return;
        filename.classList.toggle('is-visible', visible);
      };

      const renderCoverflow = () => {
        if (!stage) return;
        stage.querySelectorAll('[data-coverflow-card]').forEach((card) => card.remove());
        cards = media.map((item, index) => {
          const card = document.createElement('figure');
          card.className = 'coverflow-card';
          card.dataset.coverflowCard = String(index);

          const frame = document.createElement('div');
          frame.className = 'coverflow-media';

          const img = document.createElement('img');
          img.src = item.src;
          img.alt = item.alt || 'Roulette image';
          img.loading = 'lazy';
          frame.appendChild(img);
          card.appendChild(frame);
          card.addEventListener('click', () => {
            if (!spinning) moveTo(index);
          });
          stage.appendChild(card);
          return card;
        });
        updateCoverflow();
      };

      const updateCoverflow = (winner = false) => {
        const stageWidth = stage ? stage.getBoundingClientRect().width : 980;
        const spacing = Math.max(118, Math.min(205, stageWidth * .17));

        cards.forEach((card, index) => {
          const distance = coverflowSlot(index, activeIndex);
          const abs = Math.abs(distance);
          const visible = abs <= 3;
          const direction = distance < 0 ? -1 : 1;
          const isRevealedWinner = revealed && abs === 0;
          const translateX = isRevealedWinner ? 0 : distance * spacing;
          const translateZ = isRevealedWinner ? 220 : (abs === 0 ? 140 : 40 - abs * 44);
          const rotateY = abs === 0 ? 0 : direction * -48;
          const scale = isRevealedWinner ? 1 : Math.max(.66, 1 - abs * .1);
          const opacity = visible ? Math.max(.28, 1 - abs * .2) : 0;
          const blur = abs > 2 ? 1.5 : 0;

          card.classList.toggle('is-active', abs === 0);
          card.classList.toggle('is-winner', winner && abs === 0);
          card.style.zIndex = String(20 - abs);
          card.style.opacity = String(opacity);
          card.style.pointerEvents = visible ? 'auto' : 'none';
          card.style.filter = `blur(${blur}px) saturate(${abs === 0 ? 1.08 : .86})`;
          card.style.left = `calc(50% + ${translateX}px)`;
          card.style.transform = `translate(-50%, -50%) translateZ(${translateZ}px) rotateY(${rotateY}deg) scale(${scale})`;
        });

        updateFilename();
      };

      const moveTo = (index, winner = false) => {
        activeIndex = wrapIndex(index);
        if (!winner) {
          revealed = false;
          stage?.classList.remove('is-revealed');
          showFilename(false);
        }
        updateCoverflow(winner);
      };

      const randomIndex = () => Math.floor(Math.random() * media.length);
      renderCoverflow();
      window.addEventListener('resize', () => updateCoverflow());

      button?.addEventListener('click', () => {
        if (spinning || !media.length) return;
        spinning = true;
        revealed = false;
        button.disabled = true;
        stage?.classList.remove('is-revealed');
        showFilename(false);
        if (status) status.textContent = 'Spinning...';

        const winnerIndex = randomIndex();
        let delay = 54;
        const deadline = Date.now() + 4000;
        let steps = 0;

        const tick = () => {
          steps += 1;
          moveTo(activeIndex + 1);

          if (Date.now() >= deadline) {
            revealed = true;
            stage?.classList.add('is-revealed');
            moveTo(winnerIndex, true);
            window.setTimeout(() => cards[winnerIndex]?.classList.remove('is-winner'), 800);
            showFilename(true);
            if (status) status.textContent = '';
            button.disabled = false;
            spinning = false;
            return;
          }

          if (steps > 18) delay = Math.min(delay + 16, 245);
          window.setTimeout(tick, delay);
        };

        tick();
      });
    });
  </script>
</body>
</html>
