<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roulette - BitShop</title>
  <link rel="stylesheet" href="site-ui.css">
  <style>
    :root { --bg: #0b0c10; }
    html { font-size: 16px; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(140vw 90vh at 50% -10%, rgba(82, 101, 189, 0.14), transparent 70%),
        radial-gradient(110vw 70vh at 80% 10%, rgba(56,189,248,.10), transparent 60%),
        linear-gradient(var(--bg), var(--bg));
      background-repeat: no-repeat;
      background-attachment: fixed, fixed, fixed;
      background-color: var(--bg);
    }
    .coverflow-stage {
      position: relative;
      width: 100%;
      height: 320px;
      perspective: 1300px;
      perspective-origin: 50% 50%;
      overflow: hidden;
      transform-style: preserve-3d;
      display: grid;
      place-items: center;
    }
    .coverflow-stage::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 52%;
      width: min(56vw, 560px);
      height: min(22vw, 180px);
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse, rgba(103,232,249,.18), transparent 68%);
      filter: blur(10px);
      pointer-events: none;
    }
    .coverflow-stage::after {
      content: "";
      position: absolute;
      inset: auto 6% 22px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent);
      pointer-events: none;
    }
    .coverflow-card {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 220px;
      margin: 0;
      aspect-ratio: 4 / 4;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 10px;
      overflow: hidden;
      background: rgba(4,8,14,.86);
      box-shadow: 0 24px 70px rgba(0,0,0,.36);
      transform: translate(-50%, -50%);
      transform-style: preserve-3d;
      transition: left .34s cubic-bezier(.2,.8,.2,1), width .34s ease, height .34s ease, transform .34s cubic-bezier(.2,.8,.2,1), opacity .34s ease, filter .34s ease, box-shadow .34s ease, border-color .34s ease, background .34s ease;
      will-change: left, transform, opacity, filter;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 0;
    }
    .coverflow-media {
      width: 100%;
      height: 100%;
      border-radius: 7px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.08), rgba(255,255,255,.025) 58%, rgba(0,0,0,.12));
      display: grid;
      place-items: center;
    }
    .coverflow-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }
    .coverflow-card.is-active {
      border-color: rgba(103,232,249,.62);
      box-shadow: 0 34px 90px rgba(56,189,248,.16), 0 0 0 1px rgba(103,232,249,.26);
    }
    .coverflow-stage.is-revealed .coverflow-card:not(.is-active) {
      filter: saturate(.45) brightness(.7) !important;
      pointer-events: none;
    }
    .coverflow-stage.is-revealed .coverflow-card.is-active {
      border-color: #a99cff;
      box-shadow: 0 16px 50px #7865ff40, 0 0 0 2px #a99cff66;
    }
    .coverflow-card.is-winner {
      animation: revealPop .7s cubic-bezier(.18,.9,.24,1.25);
    }
    .coverflow-marker {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 76px;
      height: 3px;
      border-radius: 999px;
      background: rgb(103,232,249);
      box-shadow: 0 0 24px rgba(103,232,249,.55);
      z-index: 2;
    }
    .roulette-page { flex: 1; width: min(100%, 900px); margin: 0 auto; padding: 32px 24px 40px; }
    .roulette-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .roulette-heading h1 { margin: 0; }
    .roulette-intro { margin: 4px 0 0; color: #b9c5d8; }
    .roulette-balance { flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid #4c4569; border-radius: 10px; background: #171c30; color: #c5cee0; }
    .roulette-balance strong { color: #f2f3fb; }
    .roulette-panel { padding: 8px 16px 24px; text-align: center; border: 1px solid #35405b; border-radius: 18px; background: linear-gradient(145deg, #121a2a, #0c121e); }
    .roulette-feedback { min-height: 96px; padding: 12px 0; display: flex; flex-direction: column; justify-content: center; }
    .roulette-result { margin: 0; color: #c5cee0; font-size: 15px; line-height: 1.5; }
    .roulette-pack-name { display: none; margin: 6px auto 0; max-width: 640px; font-size: clamp(20px, 3vw, 26px); font-weight: 800; line-height: 1.2; color: #f2f3fb; text-wrap: balance; overflow-wrap: anywhere; }
    .roulette-pack-name.is-visible { display: block; }
    .roulette-page [data-spin-button] { min-width: 240px; min-height: 48px; font-size: 15px; background: #6550d8; border-color: #a99cff; }
    .roulette-page [data-spin-button]:hover:not(:disabled) { background: #705be3; }
    .roulette-page [data-spin-button]:disabled { opacity: 1; background: #30354f; border-color: #64708c; color: #d6deed; cursor: wait; }
    @keyframes revealPop {
      0% { transform: translate(-50%, -50%) translateZ(100px) scale(.94); }
      45% { transform: translate(-50%, -50%) translateZ(100px) scale(1.03); }
      100% { transform: translate(-50%, -50%) translateZ(100px) scale(1); }
    }
    @media (max-width: 640px) {
      .roulette-page { padding: 20px 12px 28px; }
      .roulette-heading { align-items: flex-start; flex-direction: column; gap: 12px; margin-bottom: 16px; }
      .roulette-balance { padding: 6px 12px; }
      .roulette-panel { padding: 0 12px 20px; }
      .coverflow-stage { height: 264px; }
      .coverflow-card { width: 172px; }
      .roulette-page [data-spin-button] { width: 100%; min-width: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .coverflow-card { transition: none; }
      .coverflow-card.is-winner { animation: none; }
    }
  </style>
</head>
<body class="storefront">
  <header class="site-header">
    <nav class="site-nav" aria-label="Main navigation">
      <a class="site-brand" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m12 3 9 5v8l-9 5-9-5V8zM3 8l9 5 9-5M12 13v8M7.5 5.5l9 5"/></svg>BitShop</a>
      <div class="site-nav__actions"><a class="ui-button" href="home.html">Products</a><a class="ui-button" href="admin.php">Admin</a></div>
    </nav>
  </header>

  <main class="roulette-page">
    <div class="roulette-heading">
      <div>
        <h1 id="roulette-title">Roulette</h1>
        <p class="roulette-intro">Spin to discover a random pack.</p>
      </div>
      <div class="roulette-balance" aria-label="Token balance: unlimited">
        <span>Tokens</span><strong>Unlimited</strong>
      </div>
    </div>
    <section class="roulette-panel" aria-labelledby="roulette-title">
      <div class="coverflow-stage" data-coverflow-stage aria-hidden="true">
        <div class="coverflow-marker" aria-hidden="true"></div>
      </div>
      <div class="roulette-feedback" role="status" aria-live="polite" aria-atomic="true">
        <p class="roulette-result" data-roulette-status>Loading packs&hellip;</p>
        <p class="roulette-pack-name" data-roulette-filename></p>
      </div>
      <button type="button" class="ui-button" data-spin-button disabled>Loading packs&hellip;</button>
    </section>
  </main>

  <footer class="site-footer">
    <div>&copy; 2025 BitShop</div>
    <div>
      <a href="support.html">Support</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const fallbackMedia = [
        { src: 'Pack1.png', alt: 'Roulette image' },
        { src: 'Pack2.png', alt: 'Roulette image' },
        { src: 'Pack3.png', alt: 'Roulette image' },
        { src: 'Pack4.png', alt: 'Roulette image' },
        { src: 'Pack5.png', alt: 'Roulette image' },
        { src: 'Pack6.png', alt: 'Roulette image' }
      ];

      const stage = document.querySelector('[data-coverflow-stage]');
      const button = document.querySelector('[data-spin-button]');
      const status = document.querySelector('[data-roulette-status]');
      const packName = document.querySelector('[data-roulette-filename]');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let products = [];
      let media = fallbackMedia;
      let spinning = false;
      let revealed = false;
      let activeIndex = 0;
      let cards = [];

      const validMedia = (items) => Array.isArray(items)
        ? items.filter((item) => item && typeof item.src === 'string' && item.src.trim() !== '')
        : [];

      try {
        const response = await fetch(`products.json?v=${Date.now()}`, { cache: 'no-store' });
        if (response.ok) {
          const config = await response.json();
          products = Object.values(config.products || {});
          const rouletteMedia = validMedia(config.roulette && config.roulette.media);
          if (rouletteMedia.length) {
            media = rouletteMedia;
          }
        }
      } catch (error) {
        console.warn('Could not load roulette media.', error);
      }

      const wrapIndex = (index) => ((index % media.length) + media.length) % media.length;

      const coverflowSlot = (index, center) => {
        const length = media.length;
        let distance = index - center;
        if (distance > length / 2) distance -= length;
        if (distance < -length / 2) distance += length;
        return distance;
      };

      // Match configured media to catalogue names; never expose upload filenames.
      const mediaKey = (src) => {
        try {
          const url = new URL(src, document.baseURI);
          return url.origin + url.pathname;
        } catch { return String(src || ''); }
      };
      const displayName = (item, index) => {
        const product = products.find(product => product && validMedia(product.media)
          .some(image => mediaKey(image.src) === mediaKey(item.src)));
        const name = typeof item.name === 'string' ? item.name.trim() : '';
        const productName = typeof product?.name === 'string' ? product.name.trim() : '';
        const alt = typeof item.alt === 'string' ? item.alt.trim() : '';
        const descriptiveAlt = !/^(roulette|selected|product)?\s*image(?:\s+\d+)?$/i.test(alt)
          && !/[/\\]|\.(png|jpe?g|webp|gif|svg|avif)(?:[?#].*)?$/i.test(alt)
          && !/^[a-f0-9]{16,}$/i.test(alt);
        return name || productName || (descriptiveAlt ? alt : '') || `Pack ${index + 1}`;
      };
      media = media.map((item, index) => ({ ...item, name: displayName(item, index) }));

      const showPackName = (visible) => {
        packName.textContent = visible ? media[activeIndex].name : '';
        packName.classList.toggle('is-visible', visible);
      };

      const renderCoverflow = () => {
        if (!stage) return;
        stage.querySelectorAll('[data-coverflow-card]').forEach((card) => card.remove());
        cards = media.map((item, index) => {
          const card = document.createElement('figure');
          card.className = 'coverflow-card';
          card.dataset.coverflowCard = String(index);

          const frame = document.createElement('div');
          frame.className = 'coverflow-media';

          const img = document.createElement('img');
          img.src = item.src;
          img.alt = item.name;
          img.loading = 'lazy';
          frame.appendChild(img);
          card.appendChild(frame);
          stage.appendChild(card);
          return card;
        });
        updateCoverflow();
      };

      const updateCoverflow = (winner = false) => {
        const stageWidth = stage ? stage.getBoundingClientRect().width : 980;
        const spacing = Math.max(84, Math.min(170, stageWidth * .2));

        cards.forEach((card, index) => {
          const distance = coverflowSlot(index, activeIndex);
          const abs = Math.abs(distance);
          const visible = abs <= 3;
          const direction = distance < 0 ? -1 : 1;
          const isRevealedWinner = revealed && abs === 0;
          const translateX = isRevealedWinner ? 0 : distance * spacing;
          const translateZ = isRevealedWinner ? 100 : (abs === 0 ? 100 : 40 - abs * 44);
          const rotateY = abs === 0 ? 0 : direction * -48;
          const scale = isRevealedWinner ? 1 : Math.max(.66, 1 - abs * .1);
          const opacity = visible ? (revealed && abs > 0 ? .22 : Math.max(.28, 1 - abs * .2)) : 0;
          const blur = abs > 2 ? 1.5 : 0;

          card.classList.toggle('is-active', abs === 0);
          card.classList.toggle('is-winner', winner && abs === 0);
          card.style.zIndex = String(20 - abs);
          card.style.opacity = String(opacity);
          card.style.pointerEvents = 'none';
          card.style.filter = `blur(${blur}px) saturate(${abs === 0 ? 1.08 : .86})`;
          card.style.left = `calc(50% + ${translateX}px)`;
          card.style.transform = `translate(-50%, -50%) translateZ(${translateZ}px) rotateY(${rotateY}deg) scale(${scale})`;
        });

      };

      const moveTo = (index, winner = false) => {
        activeIndex = wrapIndex(index);
        if (!winner) {
          revealed = false;
          stage?.classList.remove('is-revealed');
          showPackName(false);
        }
        updateCoverflow(winner);
      };

      const randomIndex = () => Math.floor(Math.random() * media.length);
      renderCoverflow();
      status.textContent = 'Ready to discover your pack?';
      button.textContent = 'Spin (1 token)';
      button.disabled = false;
      window.addEventListener('resize', () => updateCoverflow());

      button?.addEventListener('click', () => {
        if (spinning || !media.length) return;
        spinning = true;
        revealed = false;
        button.disabled = true;
        stage?.classList.remove('is-revealed');
        showPackName(false);
        if (status) status.textContent = 'Choosing your pack...';
        button.textContent = 'Spinning...';

        const winnerIndex = randomIndex();
        let delay = 54;
        const deadline = Date.now() + (reducedMotion.matches ? 0 : 4000);
        let steps = 0;

        const tick = () => {
          steps += 1;
          moveTo(activeIndex + 1);

          if (Date.now() >= deadline) {
            revealed = true;
            stage?.classList.add('is-revealed');
            moveTo(winnerIndex, true);
            window.setTimeout(() => cards[winnerIndex]?.classList.remove('is-winner'), 800);
            showPackName(true);
            if (status) status.textContent = 'Pack revealed';
            button.textContent = 'Spin again (1 token)';
            button.disabled = false;
            spinning = false;
            return;
          }

          if (steps > 18) delay = Math.min(delay + 16, 245);
          window.setTimeout(tick, delay);
        };

        tick();
      });
    });
  </script>
</body>
</html>
