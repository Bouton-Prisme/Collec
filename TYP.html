
    <!doctype html>
<html lang="en" class="dark" data-zoom="80">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment</title>
  <meta name="description" content="Page de paiement sombre et responsive, avec sélection de produit et crypto."/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>



  <!-- UI zoom (conservé) -->
  <style id="ui-zoom">
    html { font-size: 16px; }              /* 100%  */
    html[data-zoom="90"]  { font-size: 14.4px; } /* ~90% */
    html[data-zoom="80"]  { font-size: 12.8px; } /* ~80% */
    html[data-zoom="75"]  { font-size: 11.8px; } /* ~75% */
    html[data-zoom="110"] { font-size: 17.6px; } /* ~110% */
    html[data-zoom="120"] { font-size: 19.2px; } /* ~120% */
  </style>

  <!-- Thème et fond (conservés) -->
  <style>
    :root{
      --bg:#0b0c10; --bg2:#12141a; --card:#151821; --text:#e6e8ee; --muted:#9aa3b2;
      --line:#2a2f3a; --accent:#6ee7ff; --accent2:#a78bfa; --radius:16px;
      --shadow:0 10px 28px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.4);
    }
    *,*::before,*::after{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; color:var(--text);
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
      background:
        radial-gradient(140vw 90vh at 50% -10%, rgba(82,101,189,.14), transparent 70%),
        radial-gradient(110vw 70vh at 80% 10%, rgba(56,189,248,.10), transparent 60%),
        linear-gradient(var(--bg), var(--bg));
      background-repeat:no-repeat;
      background-attachment:fixed, fixed, fixed;
      background-color:var(--bg);
    }
    a{color:inherit;text-decoration:none}
    .wrap{width:100%;max-width:680px;margin:0 auto;padding:24px}

    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
    h1{margin:0 0 8px;font-size:clamp(1.4rem,1rem + 2.2vw,2.2rem)}
    p{margin:0 0 16px}
    .muted{color:var(--muted)}

    /* Montants */
    .amounts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:16px 0 8px}
    .amount{display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;color:#fff;padding:12px 10px;background:var(--bg2);cursor:pointer}
    .amount[data-active="true"]{outline:2px solid var(--accent);outline-offset:2px}
    .amount:hover{ border-color: var(--accent); }

    .row{display:flex;gap:10px;margin-top:10px}
    .row select{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--text)}

    .custom-file::file-selector-button{
      width: 50px;
      height: 500px;
      margin-right: 5px;
      border: none;
      border-radius: 10px;
      background: transparent url('file.png') top left/ 20px 20px no-repeat;
      text-indent: -9999px;
      padding: 0;
      cursor: pointer;
    }
    .custom-file::-webkit-file-upload-button{
      width: 40px;
      height: 21px;
      margin-right: 5px;
      border: none;
      border-radius: 5px;
      background: rgba(164, 165, 167, 0.664) url('file.png') top center / 20px 20px no-repeat;
      text-indent: -9999px;
      padding: 0;
      cursor: pointer;
    }
    /* CTA */
    .cta{display:flex;gap:10px;align-items:center;margin-top:16px}
    .btn{border:1px solid transparent;color:#0b0c10;font-weight:700;padding:14px 18px;border-radius:12px;cursor:pointer;box-shadow:var(--shadow)}

    /* Badges footer */
    footer{margin:28px 0 8px;color:var(--muted);font-size:.9rem}
    .badges{margin:64px auto 24px;max-width:960px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
    .badge{padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:.875rem;color:var(--muted);background:transparent}

    /* Responsive */
    @media (max-width:800px){
      .amounts{grid-template-columns:repeat(3,1fr)}
      .row{flex-direction:column}
    }
    :where(a,button,select):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

    .paybox{
      max-width: 560px;
      margin: 16px 0 0 0;   /* plus de auto, on colle à gauche */
      padding: 16px;
      border:1px solid var(--line); border-radius:12px; background:var(--bg2); color:var(--text);
    }
    .paybox-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
    .amt{ color:var(--muted); font-weight:600; }
    .qr{ display:block; margin:12px auto; height:192px; width:192px; }
    .addr-wrap{ margin-top:8px; }
    .addr-wrap .label{ color:var(--muted); font-size:.85rem; margin-bottom:4px; }
    .copy{
      width:100%; text-align:left; font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size:.9rem; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--bg);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer;
    }
    .copy.ok{ border-color: var(--accent); }
    .ttl{ margin-top:8px; color:var(--muted); }
    .small{ font-size:.85rem; }

    .copy.ok{ border-color: var(--accent); box-shadow: 0 0 0 2px rgba(110,231,255,.25) inset; }


    .copy-status{
      margin-top:6px; font-size:.85rem; color:#34d399;  /* vert succès */
      opacity:0; transition:opacity .2s ease;
    }
    .copy-status.show{ opacity:1; }

    .copy[data-copied="1"]{
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(110,231,255,.25) inset; /* feedback visuel sur le bouton */
    }

    .copy-status{
      display:block;
      height: 1.2em;           /* réserve 1 ligne d’office -> pas de décalage */
      margin-top:6px;
      font-size:.85rem;
      color:#34d399;           /* vert succès */
      opacity:0;
      visibility:hidden;       /* invisible mais l’espace est gardé */
      transition:opacity .2s ease;
    }
    .copy-status.show{
      opacity:1;
      visibility:visible;
    }

    /* petit feedback visuel sur le bouton (optionnel) */
    .copy[data-copied="1"]{
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(110,231,255,.25) inset;
    }


    .copy-status{
      display:block; height:1.2em; margin-top:6px; font-size:.85rem;
      color:#34d399; opacity:0; visibility:hidden; transition:opacity .2s ease;
    }
    .copy-status.show{ opacity:1; visibility:visible; }
    .copy[data-copied="1"]{ border-color:var(--accent); box-shadow:0 0 0 2px rgba(110,231,255,.25) inset; }




  </style>
</head>

<body class="min-h-screen flex flex-col bg-white text-black transition-colors dark:bg-black dark:text-white">
  <header>
    <nav class="flex justify-between items-center px-6 py-4 text-sm text-gray-600 dark:text-gray-300">
      <div class="font-bold text-white text-lg"><a href="home.html" class="hover:underline">BitShop</a></div>
      <a href="home.html"
        class="px-4 py-2 text-white border border-white rounded text-sm hover:bg-white hover:text-black inline-block">
        Menu
      </a>
    </nav>
  </header>

  <div class="wrap">
    <main class="card" aria-labelledby="title">
    <section class="  max-w-x2 mx-auto text-left">
        <h1 class="text-3xl sm:text-3xl font-bold" id="title">Order details</h1>
        <p data-demo-notice class="mt-4 text-sm text-cyan-300">Demo only — no payment, email or delivery. Use fictional details to try the form.</p>
        <!-- Order summary injected from cart (before instructions) -->
        <section id="order-summary" class="mt-8 mb-6 p-4 rounded-lg border border-gray-700 bg-[#12141a]">
          <h2 class="text-xl font-semibold mb-3">Order summary</h2>
          <div id="order-summary-content" class="text-sm text-gray-200"></div>
        </section>
        <p class="text-xl ml-2 font-bold mt-8">Review your selection and provide your payment reference:</p>

<!-- Preuve de paiement -->
<form id="proof-form"
      method="POST" enctype="multipart/form-data"
      class="mt-8 space-y-1 p-4 rounded-lg border border-gray-700 bg-[#12141a]">

  <!-- Sujet d'e-mail (mis à jour dynamiquement avec le TXID) -->
  <input type="hidden" name="subject" id="mail-subject">
  <input type="hidden" name="_subject" id="mail-subject-dup"><!-- compat services -->

  <!-- Métadonnées produit (préremplies depuis l’URL) -->
  <input type="hidden" name="product_id"   id="product_id">
  <input type="hidden" name="product_name" id="product_name">
  <input type="hidden" name="currency"     id="currency">
  <input type="hidden" name="amount"       id="amount">
  <input type="hidden" name="wallet_addr"  id="wallet_addr">

  <!-- Anti-spam simple (honeypot) -->
  <input type="text" name="company" tabindex="-1" autocomplete="off" style="display:none">

  <!-- Adresse de livraison (obligatoire) -->
  <label class="block text-sm text-gray-400">Email address to receive your access</label>
  <input type="email" name="buyer_email" required
         class="w-full p-2 rounded bg-[#0b0c10] border border-gray-700" placeholder="">

  <!-- TXID (obligatoire) -->
  <label class="block text-sm text-gray-400"> Transaction ID </label>
  <input type="text" name="txid" id="txid" required
         class="w-full p-2 rounded border bg-[#0b0c10] border-gray-700" placeholder="hash / txid">


  <!-- Message prérempli (modifiable) -->
  <label class="block text-sm text-gray-400">Add a comment (optional)</label>
  <textarea name="message" rows="2" class="w-full p-2 rounded bg-[#0b0c10] border border-gray-700">
  </textarea>
  <!-- Résumé lisible dans l’e-mail -->
  <textarea name="summary" id="summary" class="hidden"></textarea>

  <!-- Pièce jointe (preuve) -->

  <label class="block text-sm text-gray-400">Proof of payment (jpg, png, pdf, ...)</label>
  <div class="flex flex-wrap gap-4 items-center w-full">
  <input type="file" name="proof" accept=".png,.jpg,.jpeg,.pdf"
         class="w-56 h-10 text-sm border border-gray-800 rounded bg-gray-300 text-black p-1.5 custom-file"/>
        <button type="submit" form="proof-form" disabled
                class="ml-auto inline-flex items-center justify-center px-4 min-h-10 border border-sky-700 bg-cyan-950  rounded">
                <span data-submit-label class="font-bold">Send</span>
          <img src="send.png" alt="" class="ml-2 h-7 w-7"/>
        </button>

  </div>

  <p id="proof-status" class="text-xs text-gray-400" style="min-height: 1.25rem;"></p>

</form>

<script src="order-summary.js"></script>

        <p id="processingMessage" class="text-xs text-gray-400 dark:text-gray-500 text-right">Submitting a reference does not confirm payment.</p>
      <div class="mt-12
       flex">
        <a href="payment.html"
          class="mt-2 px-4 py-2 text-white font-bold rounded-lg
                  background-repeat
                  hover:opacity-90 transition">
          &#11013; Back
        </a>
      </div>
      </main>
      </div>

  <footer class="mt-40 flex flex-col sm:flex-row justify-between text-xs text-gray-400 dark:text-gray-500 px-6 py-8 border-t border-gray-200 dark:border-gray-700">
    <div>© 2025 BitShop</div>
    <div class="flex gap-6 mt-2 sm:mt-0">
      <a href="support.html">Support</a>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </div>
  </footer>


</body>
</html>
